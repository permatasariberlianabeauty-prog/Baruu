# ═══════════════════════════════════════════════════════════
# NOXARA - Nginx Configuration (VPS)
# ═══════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name noxara.id www.noxara.id;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name noxara.id www.noxara.id;

    # ── SSL ───────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/noxara.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noxara.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Root ──────────────────────────────────────────────
    root  /var/www/noxara;
    index index.php index.html;

    # ── Charset & Security Headers ────────────────────────
    charset utf-8;
    add_header X-Content-Type-Options  "nosniff"                    always;
    add_header X-Frame-Options         "SAMEORIGIN"                 always;
    add_header X-XSS-Protection        "1; mode=block"              always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Upload & Timeout ──────────────────────────────────
    client_max_body_size 12M;
    fastcgi_read_timeout 120;
    proxy_read_timeout   120;

    # ── Block sensitive paths ─────────────────────────────
    location ~ ^/(config|logs|database|cron)/ {
        deny all;
        return 403;
    }
    location ~ /\.(ht|env|git) {
        deny all;
        return 403;
    }
    location ~ \.(sql|log|md)$ {
        deny all;
        return 403;
    }

    # ── Static assets (cached) ───────────────────────────
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2|woff|ttf)$ {
        expires 6M;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── PHP-FPM ───────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_param PHP_VALUE "
            upload_max_filesize=10M
            post_max_size=12M
            max_execution_time=60
            memory_limit=256M
            session.cookie_httponly=1
            session.use_strict_mode=1
        ";
    }

    # ── Main location ─────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Custom error pages ────────────────────────────────
    error_page 404 /errors/404.php;
    error_page 500 502 503 504 /errors/500.php;

    # ── Access log ────────────────────────────────────────
    access_log /var/log/nginx/noxara_access.log;
    error_log  /var/log/nginx/noxara_error.log;

    # ── Gzip ──────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
}
